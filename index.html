<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0a09">
<title id="pageTitle">For Momo Smiles ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- OPENING -->
  <section class="opening" id="opening">
    <div class="ember-field" id="emberField" aria-hidden="true"></div>
    <div class="opening-card">
      <p class="small-note">a little something</p>
      <h1>For <span class="name" id="heroName">Momo</span> Smiles <span class="heart">❤️</span></h1>
      <p>come here for a second.</p>
      <button id="enterBtn">
        <span>open</span> <span class="arrow">→</span>
      </button>
    </div>
  </section>

  <!-- GARDEN -->
  <section class="garden hidden" id="garden">

    <header class="garden-header">
      <div>
        <p class="eyebrow" id="gardenEyebrow">Momo's little garden</p>
        <h2>Pick a few.</h2>
      </div>
      <button class="music-btn" id="musicBtn" aria-pressed="false">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="musicLabel">325</span>
      </button>
    </header>

    <p class="instruction" id="instruction" aria-live="polite">
      Take your time. Pick whichever ones you like.
    </p>

    <div class="garden-scene" id="gardenScene">
      <div class="moon"></div>
      <div class="stars"></div>
      <div class="fireflies" id="fireflies" aria-hidden="true"></div>
      <div class="ground"></div>

      <button class="flower rose-red" data-flower="red" aria-label="Pick red rose">
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
        <span class="bloom"></span>
      </button>

      <button class="flower rose-pink" data-flower="pink" aria-label="Pick pink rose">
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
        <span class="bloom"></span>
      </button>

      <button class="flower rose-white" data-flower="white" aria-label="Pick white rose">
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
        <span class="bloom"></span>
      </button>

      <button class="flower rose-yellow" data-flower="yellow" aria-label="Pick yellow rose">
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
        <span class="bloom"></span>
      </button>

      <button class="flower rose-orange" data-flower="orange" aria-label="Pick orange rose">
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
        <span class="bloom"></span>
      </button>

      <button class="flower rose-purple" data-flower="purple" aria-label="Pick purple rose">
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
        <span class="bloom"></span>
      </button>
    </div>

    <div class="picked-bar">
      <span><strong id="flowerCount">0</strong> flowers</span>
      <button id="viewBouquetBtn" disabled>view bouquet →</button>
    </div>

  </section>

  <!-- BOUQUET -->
  <section class="bouquet hidden" id="bouquet">

    <div class="bouquet-header">
      <button class="back-btn" id="backBtn">← garden</button>
      <div>
        <p class="eyebrow">you made this</p>
        <h2>Your bouquet.</h2>
      </div>
      <button class="top-btn" id="topBtn">top view</button>
    </div>

    <div class="bouquet-stage" id="bouquetStage">
      <div class="wrapper"></div>
      <div class="ribbon-bow" id="ribbonBow" aria-hidden="true">
        <span class="loop loop-left"></span>
        <span class="loop loop-right"></span>
        <span class="knot"></span>
        <span class="tail tail-left"></span>
        <span class="tail tail-right"></span>
      </div>
      <div class="bouquet-flowers" id="bouquetFlowers"></div>
    </div>

    <p class="bouquet-hint" id="bouquetHint">drag it around.</p>

    <!-- LOVE LETTER -->
    <article class="note-card" id="noteCard">

      <div class="seal-layer" id="sealLayer">
        <button class="wax-seal" id="sealBtn" aria-label="Break the seal to read the letter">
          <span class="seal-initial" id="sealInitial">M</span>
        </button>
        <p class="seal-hint">tap the seal to read it</p>
      </div>

      <div class="letter-inner" id="letterInner">
        <p class="small-note" id="noteRecipientLabel">For Momo ❤️</p>
        <div id="letterBody"></div>
        <p class="signature">Love always,<br><strong id="letterSignature">— Bigduggmustfall ❤️</strong></p>
      </div>

    </article>

  </section>

  <!-- MUSIC -->
  <audio id="song" loop preload="none">
    <source src="assets/325.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
